<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Win95 style DocChat icon: document with chat bubble -->

  <!-- Document shadow -->
  <rect x="6" y="5" width="18" height="22" fill="#808080"/>

  <!-- Document body -->
  <rect x="4" y="3" width="18" height="22" fill="#FFFFFF"/>

  <!-- Document border - outer bevel (Win95 raised style) -->
  <!-- Top + left highlight -->
  <rect x="4" y="3" width="18" height="1" fill="#DFDFDF"/>
  <rect x="4" y="3" width="1" height="22" fill="#DFDFDF"/>
  <!-- Bottom + right shadow -->
  <rect x="4" y="24" width="18" height="1" fill="#808080"/>
  <rect x="21" y="3" width="1" height="22" fill="#808080"/>
  <!-- Inner dark edge -->
  <rect x="5" y="23" width="16" height="1" fill="#404040"/>
  <rect x="21" y="4" width="1" height="20" fill="#404040"/>

  <!-- Page fold (top-right corner) -->
  <polygon points="18,3 22,3 22,7 18,7" fill="#C0C0C0"/>
  <polygon points="18,3 22,7 18,7" fill="#FFFFFF"/>
  <line x1="18" y1="3" x2="22" y2="7" stroke="#808080" stroke-width="0.5"/>

  <!-- Document text lines -->
  <rect x="7" y="7" width="9" height="1" fill="#000080"/>
  <rect x="7" y="9" width="11" height="1" fill="#808080"/>
  <rect x="7" y="11" width="10" height="1" fill="#808080"/>
  <rect x="7" y="13" width="8" height="1" fill="#808080"/>
  <rect x="7" y="15" width="11" height="1" fill="#808080"/>
  <rect x="7" y="17" width="6" height="1" fill="#808080"/>

  <!-- Chat bubble - background -->
  <rect x="14" y="16" width="16" height="11" rx="1" fill="#000080"/>
  <!-- Chat bubble bevel highlight -->
  <rect x="14" y="16" width="16" height="1" fill="#0000FF"/>
  <rect x="14" y="16" width="1" height="11" fill="#0000FF"/>
  <!-- Chat bubble bevel shadow -->
  <rect x="14" y="26" width="16" height="1" fill="#000040"/>
  <rect x="29" y="16" width="1" height="11" fill="#000040"/>

  <!-- Chat bubble tail -->
  <polygon points="16,27 16,30 19,27" fill="#000080"/>

  <!-- Chat bubble inner area (white) -->
  <rect x="16" y="18" width="12" height="7" fill="#FFFFFF"/>

  <!-- Chat dots (typing indicator / AI response) -->
  <rect x="18" y="20" width="2" height="2" fill="#008080"/>
  <rect x="22" y="20" width="2" height="2" fill="#008080"/>
  <rect x="26" y="20" width="2" height="2" fill="#008080"/>

  <!-- Small AI sparkle/star -->
  <rect x="23" y="23" width="1" height="1" fill="#FF0000"/>
  <rect x="22" y="24" width="1" height="1" fill="#FFFF00"/>
  <rect x="24" y="24" width="1" height="1" fill="#FFFF00"/>
  <rect x="23" y="25" width="1" height="1" fill="#FF0000"/>
</svg>