service: pdf-pipeline

build:
  esbuild:
    bundle: true
    minify: false
    platform: node
    target: node22
    format: cjs

plugins:
  - serverless-step-functions

useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  environment:
    DOCUMENTS_TABLE: UserDocuments
    S3_BUCKET: ${self:service}-${sls:stage}-pdf-uploads
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    PINECONE_API_KEY: ${env:PINECONE_API_KEY, ''}
    PINECONE_INDEX: ${env:PINECONE_INDEX, 'pdf-documents'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:GetItem
          Resource: !GetAtt DocumentsTable.Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - !Sub arn:aws:s3:::${self:service}-${sls:stage}-pdf-uploads
            - !Sub arn:aws:s3:::${self:service}-${sls:stage}-pdf-uploads/*

functions:
  extractText:
    handler: src/handlers.extractText
  chunkText:
    handler: src/handlers.chunkText
  processAndIndexChunks:
    handler: src/handlers.processAndIndexChunks
  updateStatus:
    handler: src/handlers.updateStatus

stepFunctions:
  stateMachines:
    pdfProcessingPipeline:
      name: ${self:service}-${sls:stage}-workflow
      events:
        - eventBridge:
            event:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - ${self:service}-${sls:stage}-pdf-uploads
      definition:
        Comment: "PDF Processing Workflow"
        StartAt: ExtractTextStep
        States:
          ExtractTextStep:
            Type: Task
            Resource:
              Fn::GetAtt: [extractText, Arn]
            Next: ChunkTextStep
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: UpdateStatusErrorStep
          ChunkTextStep:
            Type: Task
            Resource:
              Fn::GetAtt: [chunkText, Arn]
            Next: ProcessAndIndexChunksStep
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: UpdateStatusErrorStep
          ProcessAndIndexChunksStep:
            Type: Task
            Resource:
              Fn::GetAtt: [processAndIndexChunks, Arn]
            Next: UpdateStatusSuccessStep
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: "$.error"
                Next: UpdateStatusErrorStep
          UpdateStatusSuccessStep:
            Type: Task
            Resource:
              Fn::GetAtt: [updateStatus, Arn]
            Parameters:
              status: "success"
              "data.$": "$"
            End: true
          UpdateStatusErrorStep:
            Type: Task
            Resource:
              Fn::GetAtt: [updateStatus, Arn]
            Parameters:
              status: "error"
              "error.$": "$.error"
              "data.$": "$"
            End: true

resources:
  Resources:
    PdfUploadsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-${sls:stage}-pdf-uploads
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - "*"
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
              AllowedOrigins:
                - "*"
        NotificationConfiguration:
          EventBridgeConfiguration:
            EventBridgeEnabled: true
    DocumentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: UserDocuments
        AttributeDefinitions:
          - AttributeName: userEmail
            AttributeType: S
        KeySchema:
          - AttributeName: userEmail
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    BackendSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for NestJS Backend API server
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: 0.0.0.0/0
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: 0.0.0.0/0
          - IpProtocol: tcp
            FromPort: 3000
            ToPort: 3000
            CidrIp: 0.0.0.0/0

    BackendInstance:
      Type: AWS::EC2::Instance
      Properties:
        InstanceType: t4g.micro
        ImageId: resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
        SecurityGroupIds:
          - !Ref BackendSecurityGroup
        Tags:
          - Key: Name
            Value: ${self:service}-${sls:stage}-backend-api
        UserData:
          Fn::Base64: |
            #!/bin/bash
            curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
            apt-get install -y nodejs git
            npm install -g pm2

    BackendElasticIP:
      Type: AWS::EC2::EIP
      Properties:
        InstanceId: !Ref BackendInstance

  Outputs:
    BackendPublicIp:
      Description: Static Elastic IP Address of the NestJS Backend EC2 Instance
      Value: !Ref BackendElasticIP
